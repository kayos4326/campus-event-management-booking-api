# Runs on every push and pull request. Nothing here needs a secret. It checks that the app
# installs and generates its Prisma client, that every migration applies to an empty MySQL
# and matches schema.prisma, that the frontend lints and builds, that the deploy scripts
# parse and pass ShellCheck, and that the Docker image builds. Deploying stays a manual
# step (./deploy.sh). The test suites live outside this repository.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API build (Node 18, as on the VM)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `prisma validate` resolves env("DATABASE_URL") out of schema.prisma before it will
    # check anything, even though checking the schema needs no database. The tests
    # themselves mock Prisma, so a placeholder is enough: this job never opens a
    # connection. The `database` job below is the one that talks to a real MySQL.
    env:
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/campus_events
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.19.1
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate

  database:
    name: Migrations on MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: campus_events
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/campus_events
      APP_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.19.1
          cache: npm
      - run: npm ci
      - run: npx prisma generate

      - name: Every migration applies to an empty database
        run: npx prisma migrate deploy

      # The migrations are hand-written, so check they build exactly the schema in
      # schema.prisma — a missed column would otherwise only show up in production.
      - name: The migrations match schema.prisma
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE shadow"
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url mysql://root:root@127.0.0.1:3306/shadow \
            --exit-code


  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Vite 8 needs Node 20.19+; the VM never builds the frontend
          cache: npm
          cache-dependency-path: frontend-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  scripts:
    name: Deploy scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash -n deploy.sh && bash -n scripts/remote-deploy.sh
      - run: shellcheck deploy.sh scripts/remote-deploy.sh

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag campus-event-api:ci .
